:root{
  --red:#bd180a;
  --red-hi:#e8321f;
  --concrete:#e6e1d8;
  --ink:#0b0b0c;
  --white:#f6f4ef;
  /* Brand fonts are used when installed on the streaming PC; web/bundled fonts are the fallback. */
  --f-head:"TT Lakes Black","TT Lakes","TTLakes-Black","Russo One","PoppinsLocal",Impact,sans-serif;
  --f-wide:"TT Lakes","TTLakes-Bold","Saira","PoppinsLocal",system-ui,sans-serif;
}
html,body{margin:0;height:100%;overflow:hidden;background:#000}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
  font-family:var(--f-wide);-webkit-font-smoothing:antialiased}
#stage > svg.bg{position:absolute;left:0;top:0;width:1920px;height:1080px}
[data-fit]{display:block;white-space:nowrap}
.abs{position:absolute}

.side{position:absolute;top:50%;font:600 15px/1 var(--f-wide);letter-spacing:.42em;white-space:nowrap;opacity:0;animation:fade .8s ease 1s forwards}
.side.l{left:44px;transform:translate(-50%,-50%) rotate(-90deg)}
.side.r{right:44px;transform:translate(50%,-50%) rotate(90deg)}
.footer{position:absolute;font:600 15px/1 var(--f-wide);letter-spacing:.38em;opacity:0;animation:fade .8s ease 1.4s forwards}
.kick{display:inline-block;background:var(--red);color:#fff;font:700 19px/1 var(--f-wide);letter-spacing:.3em;padding:9px 14px 9px 16px}

.in-up{opacity:0;transform:translateY(18px);animation:up .7s cubic-bezier(.2,.8,.2,1) forwards}
.in-left{opacity:0;transform:translateX(-60px);animation:up .7s cubic-bezier(.2,.8,.2,1) forwards}
.in-pop{opacity:0;transform:scale(.6);animation:pop .7s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes up{to{opacity:1;transform:none}}
@keyframes pop{to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}

/* rotating message line (used by Screens.ticker) */
.tk{position:absolute;inset:0;display:flex;align-items:center;white-space:nowrap;overflow:hidden;opacity:0;transform:translateY(22px);transition:opacity .5s,transform .5s}
.tk.on{opacity:1;transform:none}
.tk.out{opacity:0;transform:translateY(-22px)}

</style>
<style>
  #stage{background:var(--concrete);color:var(--ink)}
  .dk{transform:translateX(-700px);animation:slideR .9s cubic-bezier(.2,.8,.2,1) .05s forwards}
  .dk2{transform:translateX(700px);animation:slideR .9s cubic-bezier(.2,.8,.2,1) .15s forwards}
  @keyframes slideR{to{transform:none}}
  .logo{left:96px;top:46px;width:400px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.25))}
  .ttl{left:540px;top:52px;font:400 96px/1 var(--f-head);color:var(--red);text-transform:uppercase}
  .meta{right:100px;top:58px;text-align:right}
  .meta .k{display:inline-block;background:var(--ink);color:#fff;font:700 18px/1 var(--f-wide);letter-spacing:.28em;padding:9px 14px}
  .meta .g{font:400 44px/1 var(--f-head);margin-top:12px}
  .tables{left:96px;right:96px;top:200px;display:flex;gap:40px;justify-content:center}
  .tbl{flex:1;min-width:0;max-width:1180px}
  .hdr{display:flex;align-items:flex-end;height:58px;background:var(--red);color:#fff;font:700 17px/1.05 var(--f-wide);letter-spacing:.08em;padding:0 22px 10px;
    clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,14px 100%,0 50%)}
  .rows{background:var(--ink);color:var(--white);box-shadow:12px 12px 0 rgba(0,0,0,.18)}
  .r{display:flex;align-items:center;height:var(--rh,70px);border-bottom:1px solid rgba(255,255,255,.08);padding:0 22px;opacity:0;animation:up .45s cubic-bezier(.2,.8,.2,1) forwards}
  .r:last-child{border-bottom:0}
  .c-rk{width:60px;font:400 calc(30px*var(--k,1))/1 var(--f-head);color:var(--red-hi)}
  .c-tm{flex:1;min-width:0;font:400 calc(30px*var(--k,1))/1 var(--f-head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
  .c-lo{width:150px;font:700 18px/1 var(--f-wide);letter-spacing:.1em;color:#bdb7ad;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .c-n{width:96px;text-align:center;font:700 calc(26px*var(--k,1))/1 var(--f-wide);font-variant-numeric:tabular-nums}
  .c-t{width:96px;text-align:right;font:400 calc(34px*var(--k,1))/1 var(--f-head);font-variant-numeric:tabular-nums}
  .hdr .c-rk,.hdr .c-tm,.hdr .c-n,.hdr .c-t,.hdr .c-lo{font:700 17px/1.05 var(--f-wide);color:#fff;letter-spacing:.08em}
  .hdr .c-t{text-align:right}
  .r.top .c-rk{color:#fff}
  .r.top{background:linear-gradient(90deg,rgba(232,50,31,.35),rgba(232,50,31,0) 70%)}
  .r.first{background:linear-gradient(90deg,rgba(232,50,31,.7),rgba(232,50,31,.08) 80%)}
  .side.r2{right:44px;color:var(--red);transform:translate(50%,-50%) rotate(90deg)}
  .meta .up{font:700 14px/1 var(--f-wide);letter-spacing:.24em;color:#6d675e;margin-top:8px;min-height:14px}
  .r.noanim{opacity:1;animation:none}
  .err{left:96px;right:96px;bottom:20px;background:#fff3cd;color:#5c4400;padding:10px 16px;font:700 18px/1.3 var(--f-wide)}
</style>
</head>

/* Shared engine for the broadcast screens. You shouldn't need to edit this file –
   all the settings live at the top of each screen's .html file. */
(() => {
  // eslint-disable-next-line no-undef
  const S = Object.assign({}, (typeof SETTINGS !== 'undefined' ? SETTINGS : window.SETTINGS) || {});
  const qs = new URLSearchParams(location.search);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // colors from SETTINGS.colors → CSS variables
  const col = S.colors || {};
  const root = document.documentElement.style;
  [['red', '--red'], ['redBright', '--red-hi'], ['concrete', '--concrete'], ['black', '--ink'], ['white', '--white']]
    .forEach(([k, v]) => { if (col[k]) root.setProperty(v, col[k]); });

  const stage = document.getElementById('stage');
  const fit = () => { stage.style.transform = `scale(${Math.min(innerWidth / 1920, innerHeight / 1080)})`; };
  addEventListener('resize', fit); fit();

  // Countdown target: URL ?at= / ?min= override SETTINGS.startAt / SETTINGS.countdownMinutes.
  function resolve(name) {
    const at = qs.get('at') || S.startAt;
    if (at && /^\d{1,2}(:\d{2})?$/.test(String(at).trim())) {
      const [h, m] = String(at).trim().split(':').map(Number);
      const d = new Date(); d.setHours(h, m || 0, 0, 0);
      if (d.getTime() < Date.now() - 6 * 3600e3) d.setDate(d.getDate() + 1);
      return { target: d.getTime(), total: (+S.countdownMinutes || 10) * 60 };
    }
    const min = +(qs.get('min') || S.countdownMinutes || 0);
    if (!min) return null;
    const key = `apexScreens:${name}:${min}`;
    let t = Date.now() + min * 60e3;
    try {
      const saved = +localStorage.getItem(key);
      if (!qs.has('reset') && saved && saved > Date.now() - 60e3) t = saved;  // survive scene switches
      else localStorage.setItem(key, String(t));
    } catch {}
    return { target: t, total: min * 60 };
  }
  function format(left) {
    const h = Math.floor(left / 3600), m = Math.floor(left % 3600 / 60), s = left % 60;
    return (h ? `${h}:${String(m).padStart(2, '0')}` : String(m).padStart(2, '0')) + ':' + String(s).padStart(2, '0');
  }
  // cb({ left, text, done, progress }) four times a second, or cb(null) when no countdown is set.
  function countdown(name, cb) {
    const r = resolve(name);
    if (!r) { cb(null); return; }
    const run = () => {
      const left = Math.max(0, Math.round((r.target - Date.now()) / 1000));
      cb({ left, done: left === 0, text: left === 0 ? (S.doneText || '00:00') : format(left), progress: Math.min(1, Math.max(0, 1 - left / r.total)) });
    };
    run(); setInterval(run, 250);
  }

  function fitText(el, max) {
    let s = max; el.style.fontSize = s + 'px';
    while (el.scrollWidth > el.clientWidth + 1 && s > 20) { s -= 2; el.style.fontSize = s + 'px'; }
  }
  function fitAll() { document.querySelectorAll('[data-fit]').forEach(el => fitText(el, +el.dataset.fit)); }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => setTimeout(fitAll, 50));

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  function rotate(list, ms, fn) {
    if (!list || !list.length) return;
    let i = 0; fn(list[0], 0);
    if (list.length > 1) setInterval(() => { i = (i + 1) % list.length; fn(list[i], i); }, ms);
  }
  function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
  const $ = id => document.getElementById(id);
  const text = (id, v) => { const el = $(id); if (el) el.textContent = v ?? ''; return el; };
  const showIf = (id, on) => { const el = typeof id === 'string' ? $(id) : id; if (el && !on) el.style.display = 'none'; };
  // Rotating one-line messages that slide up inside a box.
  function ticker(box, msgs, seconds) {
    msgs = (msgs || []).filter(Boolean);
    if (!box || !msgs.length) return false;
    let i = 0, cur = null;
    const next = () => {
      if (cur) { const old = cur; old.classList.remove('on'); old.classList.add('out'); setTimeout(() => old.remove(), 600); }
      cur = document.createElement('div');
      cur.className = 'tk';
      cur.textContent = msgs[i++ % msgs.length];
      box.appendChild(cur);
      let fs = parseFloat(getComputedStyle(cur).fontSize);
      while (cur.scrollWidth > cur.clientWidth + 1 && fs > 12) { fs -= 1; cur.style.fontSize = fs + 'px'; }
      requestAnimationFrame(() => requestAnimationFrame(() => cur.classList.add('on')));
    };
    setTimeout(() => { next(); if (msgs.length > 1) setInterval(next, (+seconds || 6) * 1000); }, 1500);
    return true;
  }

  window.Screens = { S, qs, esc, stage, countdown, fitText, fitAll, sleep, rotate, rng, $, text, showIf, ticker };
})();

<script>
(() => {

  const PP = S.placementPoints || [];

  const norm = v => String(v ?? '').trim().toUpperCase();
  const same = (a, b) => { const f = v => norm(v).replace(/\s+/g, ' ').replace(/\b0+(\d)/g, '$1'); return f(a) === f(b); };  // 'TEAM 03' = 'Team 3'
  const listed = (S.teams || []).filter(t => t && t.name);

  // ---- reading token results (accepts the common field-name variations) ----
  const PLAYERS = ['player_results', 'playerResults', 'players', 'results'];
  const MATCH_ID = ['mid', 'match_id', 'matchId', 'id'];

  const PLACEMENT = ['teamPlacement', 'team_placement', 'placement', 'place', 'rank'];
  const KILLS = ['kills', 'kill_count', 'killCount', 'eliminations'];
  const pick = (o, keys) => { for (const k of keys) if (o && o[k] !== undefined && o[k] !== null && o[k] !== '') return o[k]; return undefined; };
  const playersOf = m => { const p = pick(m, PLAYERS); return Array.isArray(p) && p.length ? p : null; };
  const unknownTeam = new Set();
  let unmatched = [];

  // ---- turn token matches into [team -> list of {placement, kills}] ----
  function fromMatches(matches) {
    // de-duplicate, sort oldest first, apply countGamesFrom / skipGames
    const seen = new Map();
    matches.forEach(m => { if (m && playersOf(m)) seen.set(String(pick(m, MATCH_ID) ?? pick(m, MATCH_START) ?? JSON.stringify(m).length), m); });
    let list = [...seen.values()].map(m => { const st = +pick(m, MATCH_START) || 0; return { m, t: st > 1e12 ? st : st * 1000 }; })
      .sort((a, b) => a.t - b.t);
    if (S.countGamesFrom) {
      const from = new Date(String(S.countGamesFrom).trim().replace(' ', 'T')).getTime();
      if (!isNaN(from)) list = list.filter(x => x.t >= from);
    }
    if (S.countGamesUntil) {
      const until = new Date(String(S.countGamesUntil).trim().replace(' ', 'T')).getTime();
      if (!isNaN(until)) list = list.filter(x => x.t <= until);
    }
    // drop abandoned / remade games (fewer than half the teams have a placement)
    list = list.filter(x => {
      const pl = new Map();
      playersOf(x.m).forEach(r => { const k = String(pick(r, TEAM_NUM) ?? pick(r, TEAM_NAME)); pl.set(k, Math.max(pl.get(k) || 0, +pick(r, PLACEMENT) || 0)); });
      const placed = [...pl.values()].filter(v => v > 0).length;
      return placed > 0 && placed >= pl.size / 2;
    });
    // only the most recent night: games within 8 hours of the newest game
    if (S.onlyLatestNight !== false && !S.countGamesFrom && !S.countGamesUntil && list.length) {
      const newest = Math.max(...list.map(x => x.t));
      list = list.filter(x => x.t >= newest - 8 * 3600e3);
    }
    const skip = new Set((S.skipGames || []).map(Number));
    list = list.filter((_, i) => !skip.has(i + 1));
    const byTeam = new Map();
    list.forEach(({ m }) => {
      const teams = new Map();
      const players = playersOf(m);
      players.forEach(r => {
        const num = pick(r, TEAM_NUM), nm = String(pick(r, TEAM_NAME) ?? '');
        if (num === undefined && !nm) unknownTeam.add(Object.keys(r).join(', '));
        const key = norm(nm) && !/^TEAM\s*\d+$/.test(norm(nm)) ? norm(nm) : `#${num}`;
        const t = teams.get(key) || { key, lobby: nm || `TEAM ${num}`, num, placement: 0, kills: 0, players: 0 };
        t.kills += +pick(r, KILLS) || 0;
        t.players++;
        const pl = +pick(r, PLACEMENT);
        if (pl) t.placement = pl;
        teams.set(key, t);
      });
      if (teams.size === 1 && players.length > 4) unknownTeam.add(Object.keys(players[0] || {}).join(', '));
      teams.forEach(t => {
        const e = byTeam.get(t.key) || { lobby: t.lobby, num: t.num, games: [] };
        e.games.push([t.placement, t.kills]);
        byTeam.set(t.key, e);
      });
    });
    // match token teams to the TEAMS list
    const out = [], used = new Set();
    listed.forEach(t => {
      const want = norm(t.lobbyName || t.name);
      let hit = null;
      for (const [k, e] of byTeam) {
        if (used.has(k)) continue;
        if (same(e.lobby, want) || (t.lobbyName !== undefined && t.lobbyName !== '' && String(e.num) === String(t.lobbyName))) { hit = k; break; }
      }
      if (hit) used.add(hit);
      out.push({ name: t.name, location: t.location, adjust: t.adjust, games: hit ? byTeam.get(hit).games : [] });
    });
    const extra = [];
    byTeam.forEach((e, k) => { if (!used.has(k)) extra.push({ name: e.lobby, location: '', games: e.games }); });
    // If some lobby teams didn't match the TEAMS list, show them instead of empty duplicate rows.
    const final = extra.length ? out.filter(t => t.games.length).concat(extra) : out;
    unmatched = extra.map(e => e.name);
    return { teams: final, count: list.length };
  }

  // ---- totals + ranking ----
  function standings(src) {
    const problems = [];
    const teams = src.map(t => {
      let kp = 0, pp = 0, kills = 0, wins = 0, best = 99;
      (t.games || []).forEach((g, i) => {
        if (!Array.isArray(g) || g.length < 2) { problems.push(`${t.name}: game ${i + 1} should look like [placement, kills]`); return; }
        const [pl, k] = g.map(Number);
        kp += killPts(k || 0); pp += placePts(pl); kills += k || 0;
        if (pl === 1) wins++; if (pl >= 1) best = Math.min(best, pl);
      });
      return { name: t.name, loc: t.location || '', kp, pp, total: kp + pp + (+t.adjust || 0), kills, wins, best, played: (t.games || []).length };
    }).sort((a, b) => (b.total - a.total) || (b.wins - a.wins) || (b.kills - a.kills) || (a.best - b.best) || a.name.localeCompare(b.name));
    teams.forEach((t, i) => {
      const p = teams[i - 1];
      t.rank = p && p.total === t.total && p.wins === t.wins && p.kills === t.kills && p.best === t.best ? p.rank : i + 1;
    });
    return { teams, problems };
  }

  // ---- drawing ----
  let drawn = false;
  function render(src, gamesCount, note) {
    const { teams, problems } = standings(src);
    const played = gamesCount ?? Math.max(0, ...teams.map(t => t.played));
    text('after', played ? `AFTER GAME ${played}${S.totalGames ? ` OF ${S.totalGames}` : ''}` : 'SERIES STANDINGS');
    const msgs = problems.slice(0, 3).map(p => 'Check settings – ' + p);
    if (note) msgs.unshift(note);
    if (msgs.length) console.warn('[standings]', msgs.join(' · '));
    $('err').style.display = msgs.length && S.showProductionNotes ? 'block' : 'none';
    $('err').textContent = msgs.join('  ·  ');

    const loc = false;
    const two = teams.length > 12;
    const per = two ? Math.ceil(teams.length / 2) : teams.length;
    const rh = Math.max(26, Math.min(70, Math.floor(790 / Math.max(per, 1))));  // rows shrink so every team fits on screen
    const fmt = n => (Math.round(n * 10) / 10);
    const anim = drawn ? 'noanim' : '';
    const head = `<div class="hdr"><div class="c-rk">#</div><div class="c-tm">TEAM</div>${loc ? '<div class="c-lo">LOCATION</div>' : ''}<div class="c-n">KILL<br>PTS</div><div class="c-n">PLCMNT<br>PTS</div><div class="c-t">TOTAL</div></div>`;
    const any = teams.some(t => t.played);
    const row = (t, i) => `<div class="r ${anim} ${!any ? '' : t.rank === 1 ? 'first' : t.rank <= 3 ? 'top' : ''}" style="--rh:${rh}px;animation-delay:${.45 + i * .035}s">
        <div class="c-rk">${any ? t.rank : '–'}</div><div class="c-tm">${esc(t.name)}</div>${loc ? `<div class="c-lo">${esc(t.loc)}</div>` : ''}
        <div class="c-n">${fmt(t.kp)}</div><div class="c-n">${fmt(t.pp)}</div><div class="c-t">${fmt(t.total)}</div></div>`;
    const cols = two ? [teams.slice(0, per), teams.slice(per)] : [teams];
    let k = 0;
    $('tables').innerHTML = cols.map(c => `<div class="tbl ${drawn ? '' : 'in-up'}" style="animation-delay:.35s;--k:${(rh / 70).toFixed(3)}">${head}<div class="rows">${c.map(t => row(t, k++)).join('')}</div></div>`).join('');
    // safety net: if anything still doesn't fit, shrink the whole table area to fit the screen
    const box = $('tables');
    box.style.transform = '';
    const maxH = 1080 - 200 - 24, h = box.scrollHeight, w = box.scrollWidth, maxW = box.clientWidth;
    const sc = Math.min(1, maxH / h, maxW / w);
    if (sc < 1) { box.style.transformOrigin = 'top center'; box.style.transform = `scale(${sc.toFixed(3)})`; }
    drawn = true;
  }
  const stamp = label => { if (S.showProductionNotes) text('upd', `${label} · UPDATED ${new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).toUpperCase()}`); };

  // ---- manual mode ----
  if (String(S.resultsFrom || 'token').toLowerCase() === 'manual') { render(listed); return; }

  // ---- token mode ----
  // Read pasted text leniently: pull every {...} block out of whatever was pasted.
  function extractMatches(raw) {
    const out = [];
    const take = o => {
      if (!o || typeof o !== 'object') return;
      if (Array.isArray(o)) { o.forEach(take); return; }
      if (Array.isArray(o.matches)) { o.matches.forEach(take); return; }
      if (playersOf(o)) out.push(o);
    };
    if (Array.isArray(raw)) { raw.forEach(x => typeof x === 'string' ? out.push(...extractMatches(x)) : take(x)); return out; }
    const text = String(raw || '');
    let depth = 0, start = -1, inStr = false, esc = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inStr) { if (esc) esc = false; else if (c === '\\') esc = true; else if (c === '"') inStr = false; continue; }
      if (c === '"') { inStr = true; continue; }
      if (c === '{') { if (depth === 0) start = i; depth++; }
      else if (c === '}' && depth > 0) {
        depth--;
        if (depth === 0 && start >= 0) { try { take(JSON.parse(text.slice(start, i + 1))); } catch (e) { pasteProblem = true; } start = -1; }
      }
    }
    return out;
  }
  let pasteProblem = false;
  const pastedText = Array.isArray(S.pastedResults) ? S.pastedResults : String(S.pastedResults || '');
  let pasted = extractMatches(pastedText);
  // Results pasted straight onto the page (OBS: right-click the source → Interact → Ctrl+V).
  // They're remembered in this browser source until the next paste or Ctrl+Delete.
  const LS_KEY = 'apexStandings:livePaste';
  let livePaste = '';
  try { livePaste = localStorage.getItem(LS_KEY) || ''; } catch (e) {}
  const applyLive = () => { const m = extractMatches(livePaste); pasted = extractMatches(pastedText).concat(m); return m.length; };
  if (livePaste) applyLive();
  const pastedSomething = Array.isArray(pastedText) ? pastedText.length > 0 : /\S/.test(pastedText);
  if (pastedSomething && !pasted.length) pasteProblem = true;
  const tokens = (S.statsTokens || []).map(t => String(t).trim()).filter(t => t && !/PASTE-YOUR/i.test(t));
  let fetched = new Map(); // token -> matches (kept if a later fetch fails)
  let lastError = '';

  const draw = () => {
    const all = pasted.concat(...fetched.values());
    if (!all.length) {
      const note = pasteProblem ? 'Couldn\'t read the pasted results – open the token link, Ctrl+A, Ctrl+C, and paste it between the ` marks.' : tokens.length
        ? (lastError ? `Can't load the stats token (${lastError}). Use paste mode or relayUrl – see README.` : 'Waiting for the stats token…')
        : 'No stats token or pasted results yet – add one in SETTINGS (or set resultsFrom: \'manual\').';
      render(listed.map(t => ({ ...t, games: [] })), 0, note);
      return;
    }
    unknownTeam.clear();
    const r = fromMatches(all);
    let note = '';  // pasted results are working – no need to warn on air that the token itself is blocked
    if (unknownTeam.size) note = `Couldn't tell the teams apart in these results. Fields found: ${[...unknownTeam][0]}`;
    else if (unmatched.length && listed.length) note = `Lobby team names not in your TEAMS list: ${unmatched.slice(0, 6).join(', ')}${unmatched.length > 6 ? '…' : ''} – set lobbyName for those teams.`;
    else if (pasteProblem) note = 'Part of the pasted results couldn\'t be read – copy the whole token page again and paste it between the ` marks.';
    render(r.teams, r.count, note);
    stamp(tokens.length && fetched.size ? 'LIVE FROM STATS TOKEN' : 'FROM PASTED RESULTS');
  };

  async function poll() {
    for (const tk of tokens) {
      const base = (S.relayUrl || '').trim() || TOKEN_URL;
      const url = base.includes('{token}') ? base.replace('{token}', encodeURIComponent(tk)) : base + encodeURIComponent(tk);
      try {
        const r = await fetch(url, { cache: 'no-store' });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const j = await r.json();
        if (j && j.error) throw new Error(String(j.error));
        fetched.set(tk, Array.isArray(j.matches) ? j.matches : []);
        lastError = '';
      } catch (e) {
        lastError = /Failed to fetch|NetworkError|Load failed/i.test(e.message) ? 'blocked or offline' : e.message;
        console.warn('[standings] token fetch failed:', e);
      }
    }
    draw();
  }
  // paste onto the page
  const flash = msg => { console.info('[standings]', msg); if (!S.showProductionNotes) return; const el = $('err'); el.style.display = 'block'; el.textContent = msg; setTimeout(draw, 3500); };
  document.addEventListener('paste', e => {
    const txt = (e.clipboardData || window.clipboardData).getData('text');
    e.preventDefault();
    const found = extractMatches(txt);
    if (!found.length) { flash('That paste had no game results in it – copy the whole token page (Ctrl+A, Ctrl+C) and try again.'); return; }
    livePaste = txt; try { localStorage.setItem(LS_KEY, txt); } catch (err) {}
    pasteProblem = false; applyLive(); draw();
    flash(`Pasted ${found.length} game${found.length === 1 ? '' : 's'} from the token page ✔`);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Delete' && (e.ctrlKey || e.metaKey)) {
      livePaste = ''; try { localStorage.removeItem(LS_KEY); } catch (err) {}
      applyLive(); draw(); flash('Cleared pasted results.');
    }
  });
  draw();
  if (tokens.length) { poll(); setInterval(poll, Math.max(10, +S.refreshSeconds || 30) * 1000); }
})();
</script>
</body>
</html>
