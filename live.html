<!doctype html><html><head><meta charset="utf-8"><title>Live __SCREEN__</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}iframe{position:absolute;inset:0;border:0;width:100%;height:100%;background:transparent}</style></head><body>
<script>
const screen = '__SCREEN__';
let applied = null;
// Only a change to this screen's effective settings triggers a new render.
// Keep the old frame until the new frame has loaded to avoid blank flashes.
async function sync() {
  try {
    const response = await fetch('/api/screens/' + screen, {cache:'no-store'});
    if (!response.ok) throw new Error('Settings unavailable');
    const next = JSON.stringify(await response.json());
    if (next !== applied) {
      const frame = document.createElement('iframe');
      frame.title = screen;
      frame.style.visibility = 'hidden';
      const loaded = new Promise((resolve, reject) => {
        const timeout = setTimeout(() => reject(new Error('Render timed out')), 15000);
        frame.onload = () => {clearTimeout(timeout); resolve();};
      });
      // Preserve countdown URL overrides (?at, ?min, ?reset) from the OBS URL.
      frame.src = '/render/' + screen + '.html' + location.search;
      document.body.appendChild(frame);
      try {
        await loaded;
        document.querySelectorAll('iframe').forEach(old => {if (old !== frame) old.remove();});
        frame.style.visibility = 'visible';
        applied = next;
      } catch (error) {frame.remove(); throw error;}
    }
  } catch (error) {console.warn('Live settings: retrying', error.message);}
  setTimeout(sync, 500);
}
sync();
</script></body></html>
